name: Native Release

# 2.x（GPUI 原生版）的发布流水线。1.x 的 Tauri 版仍由 release.yml 发布，它对 v2 及以上的标签不跑。
#
#   push 标签 v2.*     正式发布：4 个目标 release 构建（正式身份、静态 CRT、macOS 10.15）→ tauri bundle 打包
#                      （CLI 精确 2.11.4）→ 用 secrets 里的 TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) 签名 → 断言 →
#                      上传到草稿 release → 在 runner 上实装、检查、卸载 → 生成 latest-v2.json 上传到草稿。
#                      负责人检查草稿后手动发布；发布后由 channel-pointer-v2.yml 镜像到七牛
#                      kwikpaste/v2/stable/latest.json（2.x 唯一的更新渠道），GitHub 兜底是 channel-v2-stable 里的 latest-v2.json。
#   workflow_dispatch  干跑：同样构建、打包、断言、实装测试、生成清单，只是用 prepare 里临时生成的一次性密钥签名；
#                      不建 release、不读任何 secrets，产物留在 artifact 里（保留 7 天）。
#
# 2.x 的 GitHub release 里永远没有名为 latest.json 的资产：老客户端的备用地址是 releases/latest/download/latest.json。
# 断言见 scripts/ci/check-native-artifacts.mjs、check-nsis-render.mjs、check-pe.mjs 与 scripts/release/v2-manifest.mjs；
# scripts/ci/check-release-guards.mjs 核对本文件的标签过滤和 no-latest-json 那一段。

"on":
  push:
    tags:
      - "v2.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.version.outputs.dry_run }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # 标签、[workspace.package] version、Cargo.lock 三者一致；干跑用工作区版本拼出标签名。
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(node --input-type=module -e "import { workspaceVersion } from './scripts/release/package-native.mjs'; console.log(workspaceVersion());")"
          if ! grep -A1 '^name = "kwikpaste-app"$' Cargo.lock | grep -qx "version = \"${version}\""; then
            echo "::error::Cargo.lock does not have kwikpaste-app ${version}."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            dry_run=false
            tag_name="${GITHUB_REF_NAME}"
            if [[ "${tag_name}" != "v${version}" ]]; then
              echo "::error::Tag ${tag_name} does not match the workspace version ${version}."
              exit 1
            fi
          else
            dry_run=true
            tag_name="v${version}"
          fi
          if [[ ! "${version}" =~ ^([0-9]+)\. ]] || (( BASH_REMATCH[1] < 2 )); then
            echo "::error::native-release.yml only releases 2.x; ${version} belongs to release.yml."
            exit 1
          fi

          prerelease=false
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "dry_run=${dry_run}"
            echo "prerelease=${prerelease}"
            echo "tag_name=${tag_name}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"
          echo "${tag_name} (dry run: ${dry_run})"

      - name: Release notes
        shell: bash
        env:
          DRY_RUN: ${{ steps.version.outputs.dry_run }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          extract_changelog_section() {
            awk -v version="${VERSION}" '
            function is_target_heading(line) {
              return line ~ "^##[[:space:]]+\\[?" version "\\]?"
            }
            /^##[[:space:]]+/ {
              if (capture) {
                exit
              }
              if (is_target_heading($0)) {
                capture = 1
                next
              }
            }
            capture {
              print
            }
            ' "$1" | sed '/./,$!d' > "$2"
          }

          extract_changelog_section docs/CHANGELOG.md release-body-en.md
          extract_changelog_section docs/CHANGELOG.zh-CN.md release-body-zh.md
          if [[ ! -s release-body-en.md || ! -s release-body-zh.md ]]; then
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "::notice::No changelog section for ${VERSION} yet; the dry run uses placeholder notes."
              echo "Dry run of ${VERSION}." > release-body-en.md
              echo "${VERSION} 干跑。" > release-body-zh.md
            else
              echo "::error::docs/CHANGELOG.md and docs/CHANGELOG.zh-CN.md both need a section for ${VERSION}."
              exit 1
            fi
          fi
          {
            cat release-body-en.md
            printf '\n\n<hr>\n\n'
            cat release-body-zh.md
          } > release-body.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-body.md
          retention-days: 7

      # 干跑用的一次性签名密钥：4 个构建 job 共用，清单 job 用它的公钥验签。带随机口令：Windows 上不能有空的环境变量。
      - name: Install Tauri CLI
        if: steps.version.outputs.dry_run == 'true'
        uses: pnpm/action-setup@v6

      - name: Generate a throwaway signing key
        if: steps.version.outputs.dry_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          pnpm install --frozen-lockfile
          mkdir -p dry-run-key
          password="dry-run-$(openssl rand -hex 16)"
          pnpm tauri signer generate --ci -p "${password}" -w dry-run-key/dry-run.key -f > /dev/null
          printf '%s' "${password}" > dry-run-key/password.txt

      - name: Upload the throwaway signing key
        if: steps.version.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-key
          path: dry-run-key
          retention-days: 1

      - name: Create draft release
        if: steps.version.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          set -euo pipefail

          flags=(--draft --title "${TAG_NAME}" --notes-file release-body.md)
          if [[ "${PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            gh release edit "${TAG_NAME}" "${flags[@]}"
          else
            gh release create "${TAG_NAME}" "${flags[@]}" --verify-tag
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
      # 只有这里打出的包会上报使用统计（kwikpaste-updater 的 usage.rs 编译时读取）。
      KWIKPASTE_OFFICIAL_BUILD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: native-release-${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # tauri bundle 用 lockfile 里精确的 @tauri-apps/cli 2.11.4。
      - name: Install Tauri CLI
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Path length guard
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $length = $env:GITHUB_WORKSPACE.Length
          if ($length -gt 100) { throw "Checkout path '$env:GITHUB_WORKSPACE' is $length characters; the build needs it at most 100." }

      - name: Pin fxc.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Microsoft SDKs\Windows\v10.0').InstallationFolder
          $version = Get-ChildItem "$sdk\bin" -Directory | Where-Object Name -match '^10\.' |
            Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $fxc = Join-Path $version.FullName 'x64\fxc.exe'
          if (-not (Test-Path $fxc)) { throw "fxc.exe not found at $fxc" }
          "GPUI_FXC_PATH=$fxc" >> $env:GITHUB_ENV

      # 正式身份只在这里打开。静态 CRT 只经 --target 的 rustflags 生效（build.rs 缺了会直接失败）。
      - name: Build
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: cargo build --locked --release -p kwikpaste-app --features production-identity --target ${{ matrix.target }}

      - name: Check Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/ci/check-pe.mjs "target/${{ matrix.target }}/release/KwikPaste.exe" --version "${VERSION}" --production

      - name: Check macOS binary
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail

          bin="target/${{ matrix.target }}/release/KwikPaste"
          archs="$(lipo -archs "${bin}")"
          minos="$(otool -l "${bin}" | awk '/LC_BUILD_VERSION/ { found = 1 } found && $1 == "minos" { print $2; exit }')"
          expected_arch=x86_64
          expected_minos=10.15
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then
            expected_arch=arm64
            expected_minos=11.0
          fi
          echo "archs ${archs}, minos ${minos}"
          if [[ "${archs}" != "${expected_arch}" || "${minos}" != "${expected_minos}" ]]; then
            echo "::error::Expected ${expected_arch} with minos ${expected_minos}."
            exit 1
          fi

      - name: Download the throwaway signing key
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dry-run-key
          path: ${{ runner.temp }}/dry-run-key

      - name: Use the throwaway signing key
        if: needs.prepare.outputs.dry_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          key_dir="${RUNNER_TEMP}/dry-run-key"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$(cat "${key_dir}/dry-run.key")"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(cat "${key_dir}/password.txt")"
            echo "UPDATER_PUBKEY=${key_dir}/dry-run.key.pub"
            echo "PUBKEY_ARGS=--pubkey ${key_dir}/dry-run.key.pub"
          } >> "${GITHUB_ENV}"

      - name: Use the release signing key
        if: needs.prepare.outputs.dry_run != 'true'
        shell: bash
        run: |
          echo "UPDATER_PUBKEY=crates/kwikpaste-updater/pubkey.txt" >> "${GITHUB_ENV}"
          echo "PUBKEY_ARGS=" >> "${GITHUB_ENV}"

      # macOS：CI=false 时 dmg 才做 Finder 布局（与 release.yml 一致）。
      - name: Package (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        shell: bash
        env:
          CI: ${{ runner.os == 'macOS' && 'false' || 'true' }}
        run: node scripts/release/package-native.mjs --target ${{ matrix.target }} --out dist --features production-identity ${PUBKEY_ARGS}

      - name: Package
        if: needs.prepare.outputs.dry_run != 'true'
        shell: bash
        env:
          CI: ${{ runner.os == 'macOS' && 'false' || 'true' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release/package-native.mjs --target ${{ matrix.target }} --out dist --features production-identity

      - name: Check the rendered installer script
        if: runner.os == 'Windows'
        shell: bash
        run: |
          arch=x64
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then
            arch=arm64
          fi
          node scripts/ci/check-nsis-render.mjs "dist/nsis/${arch}" --version "${VERSION}" --arch "${arch}"

      # 资产名、.sig 验签、便携包结构、.app.tar.gz 结构与 Info.plist、e2e-overrides 哨兵、安装包体积预算。
      - name: Check the packages
        shell: bash
        run: |
          set -euo pipefail

          exe="target/${{ matrix.target }}/release/KwikPaste"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            exe="${exe}.exe"
          fi
          node scripts/ci/check-native-artifacts.mjs dist --version "${VERSION}" --pubkey "${UPDATER_PUBKEY}" --exe "${exe}"

      - name: Check the dmg
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail

          dmg="$(ls dist/*.dmg)"
          hdiutil imageinfo "${dmg}" | tee dmg-info.txt | grep -E '^Format: '
          grep -qx 'Format: UDZO' dmg-info.txt
          codesign -dv --verbose=2 "target/${{ matrix.target }}/release/bundle/macos/KwikPaste.app" 2>&1 || true

      # 实装测试用：测试身份的安装包和系统版本闸门的负向测试包（只在 Windows x64 上做）。
      - name: Package the test identity
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: node scripts/release/package-native.mjs --target ${{ matrix.target }} --out dist-test --identity test --os-gate-test --no-sign

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/KwikPaste_*
          if-no-files-found: error
          retention-days: 7

      - name: Upload test packages
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: install-test-${{ matrix.target }}
          path: dist-test
          if-no-files-found: error
          retention-days: 7

      - name: Upload to the draft release
        if: needs.prepare.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: gh release upload "${TAG_NAME}" dist/KwikPaste_* --clobber

  install-test:
    name: Install test (Windows x64)
    needs: [prepare, build]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: native-x86_64-pc-windows-msvc
          path: dist

      - name: Download test packages
        uses: actions/download-artifact@v4
        with:
          name: install-test-x86_64-pc-windows-msvc
          path: dist-test

      # 正式身份只在 runner 上实装：注册表键、安装目录、快捷方式、文件关联、关掉同名进程、重装、卸载后复原。
      - name: Install for the current user
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release/test-nsis-install.ps1
          -Setup "dist/KwikPaste_${env:VERSION}_x64-setup.exe" -Product KwikPaste -Binary KwikPaste
          -Publisher fastthree -Extension kwikpastebak -Version $env:VERSION -Launch -AllowProductionIdentity

      - name: Install for all users
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release/test-nsis-install.ps1
          -Setup "dist/KwikPaste_${env:VERSION}_x64-setup.exe" -Product KwikPaste -Binary KwikPaste
          -Publisher fastthree -Extension kwikpastebak -Version $env:VERSION -AllUsers -Launch -AllowProductionIdentity

      - name: OS gate exits with 1150
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release/test-nsis-install.ps1
          -Setup "dist-test/KwikPasteBundleTest_${env:VERSION}_x64-setup.exe" -Product KwikPasteBundleTest
          -Binary KwikPasteBundleTest -Publisher fastthree-bundletest -Extension kwikpastebundletest -Version $env:VERSION
          -GateSetup "dist-test/tests/KwikPasteBundleTest_${env:VERSION}_x64-os-gate-test-setup.exe"

      - name: Portable package starts on its own
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive -LiteralPath "dist/KwikPaste_${env:VERSION}_x64_portable.zip" -DestinationPath $dir
          $env:KWIKPASTE_SELFTEST = '1'
          $process = Start-Process (Join-Path $dir 'KwikPaste\KwikPaste.exe') -ArgumentList '--selftest-smoke' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'KwikPaste did not exit within 60 s.' }
          if ($process.ExitCode -ne 0) { throw "KwikPaste exited with $($process.ExitCode)." }
          'The portable exe started and exited cleanly.'

  manifest:
    name: Update manifest
    needs: [prepare, build, install-test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download the throwaway signing key
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dry-run-key
          path: dry-run-key

      - name: Write latest-v2.json (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        shell: bash
        run: |
          node scripts/release/v2-manifest.mjs --version "${VERSION}" --dir dist --pubkey dry-run-key/dry-run.key.pub \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}" \
            --notes release-body.md --out latest-v2.json

      - name: Write latest-v2.json
        if: needs.prepare.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name == \"${TAG_NAME}\") | .id" | head -n 1)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[] | {name, size, browser_download_url}' | jq -s . > assets.json
          jq -r '.[].name' assets.json > asset-names.txt

          # >>> no-latest-json
          if grep -qx 'latest.json' asset-names.txt; then
            echo "::error::The ${TAG_NAME} release has a latest.json asset. Old clients read releases/latest/download/latest.json; 2.x must never publish one."
            exit 1
          fi
          # <<< no-latest-json

          # 用发布后的标签地址：草稿资产的 browser_download_url 是 untagged-…，发布后就失效了。
          node scripts/release/v2-manifest.mjs --version "${VERSION}" --dir dist --pubkey crates/kwikpaste-updater/pubkey.txt \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}" \
            --assets assets.json --notes release-body.md --out latest-v2.json
          gh release upload "${TAG_NAME}" latest-v2.json --clobber

      - name: Upload latest-v2.json
        uses: actions/upload-artifact@v4
        with:
          name: latest-v2
          path: latest-v2.json
          retention-days: 7
